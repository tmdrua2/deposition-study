<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PECVD 장비 | 증착 공정 노트</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-process="cvd">
  <header id="site-header"></header>

  <!-- 장비 무대: 지금(1단계)은 외관 정지 그림. 2단계에서 스크롤 분해 연출(stage.js)이 붙는다 -->
  <section class="equip-stage" data-equipment="pecvd">
    <div class="equip-stage-copy">
      <!-- 제목 위계: 작은 영문 라벨(고정폭) → 큰 제목 → 한 줄 설명 -->
      <p class="equip-kicker">Equipment <span class="equip-kicker-no">01</span></p>
      <h1>PECVD 장비</h1>
      <p class="equip-lede">대표적인 300mm PECVD 장비 구성 — 웨이퍼가 지나가는 순서대로 번호를 붙였습니다.</p>
    </div>
    <!-- 그림틀: 장비 그림(svg) + 도면식 이름표(callouts.js가 채움) -->
    <div class="iso-figure">
      <svg class="iso-view" role="img" data-iso-view
        aria-label="PECVD 장비 외관 그림. 팹 바닥 위 앞쪽에 FOUP 3개가 놓인 EFEM과 그 위 시그널 타워, 오른쪽 끝에 조작 화면과 비상 정지 버튼이 있다. 그 뒤에 로드락 2개, 가운데 육각형 트랜스퍼 모듈, 그 둘레에 공정 챔버 4개가 붙어 있고, 오른쪽에 가스 박스와 RF 전원 장치가 있다. 바닥 아래층(서브팹)에는 공정 챔버마다 드라이 펌프가 1대씩 있고 배기 배관으로 연결된다."></svg>
    </div>
    <p class="equip-stage-note">개념도 — 실제 회사 제품의 외형·비율·사양이 아닙니다.</p>
  </section>

  <main>
    <!-- 아래 h2 제목들로 목차가 자동으로 만들어집니다 -->
    <nav id="page-toc"></nav>

    <!-- 1. 원리 -->
    <h2 id="principle">원리</h2>
    <p class="todo">작성 예정</p>

    <!-- 2. 장비 구성 -->
    <h2 id="hardware">장비 구성</h2>
    <p class="todo">작성 예정</p>

    <!-- 3. 공정 흐름 -->
    <h2 id="flow">공정 흐름</h2>
    <ol>
      <li class="todo">작성 예정</li>
    </ol>

    <!-- 4. 공정변수 표: 한 변수당 한 줄(<tr>) -->
    <h2 id="parameters">공정변수 표</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>변수</th>
            <th>올리면</th>
            <th>내리면</th>
            <th>트레이드오프</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="todo">작성 예정</td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 5. 문제와 점검 순서: 문제 하나당 <details> 하나 -->
    <h2 id="troubleshooting">문제와 점검 순서</h2>
    <details>
      <summary>문제 상황 (예: 두께 균일도 불량)</summary>
      <ol>
        <li class="todo">점검 1</li>
      </ol>
    </details>

    <!-- 6. 면접 질문: 질문 하나당 <details> 하나 -->
    <h2 id="interview">면접 질문</h2>
    <details>
      <summary>질문</summary>
      <p class="todo">내 답변 작성 예정</p>
    </details>

    <!-- 7. 출처 -->
    <h2 id="sources">출처</h2>
    <ul>
      <li class="todo">작성 예정</li>
    </ul>
  </main>

  <footer><a href="../index.html">← 목차로 돌아가기</a></footer>

  <script src="../js/pages.js"></script>
  <script src="../js/main.js"></script>
  <!-- 장비 데이터 → 렌더러 순서 (데이터가 먼저 있어야 그림을 그릴 수 있음) -->
  <script src="../data/platform.js"></script>
  <script src="../data/pecvd.js"></script>
  <script src="../js/explode/render-iso.js"></script>
  <script src="../js/explode/callouts.js"></script>
  <script>
    // 임시 시작 코드: 외관 정지 그림 + 이름표 (2단계에서 stage.js가 맡음)
    const isoSvg = document.querySelector("[data-iso-view]");
    const isoInfo = IsoRender.render(isoSvg, window.EQUIPMENT.pecvd, window.EQUIPMENT_PLATFORMS);
    EquipCallouts.mount(isoSvg.parentElement, isoSvg, isoInfo);
  </script>
</body>
</html>
