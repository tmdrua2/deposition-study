<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장비 구성 | PECVD 장비 | 증착 공정 노트</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<!-- PECVD 섹션 하위 페이지 (02 장비 구성). 공통 틀: 남색 머리(큰 제목) → 크림 본문 → 이전/다음 (js/sections.js) -->
<body data-root="../../" data-process="cvd" class="page-stage sec-page" data-equip="pecvd" data-section="hardware">
  <header id="site-header"></header>

  <!-- 섹션 머리: 남색 + 코랄 빛 + 세로 골유리, 큰 제목이 배경 위에 얹힘 -->
  <section class="sec-hero">
    <div class="sec-hero-bg" aria-hidden="true"><div class="sec-hero-glow"></div><div class="stage-reed"></div></div>
    <div class="sec-hero-inner">
      <a class="sec-back" href="../pecvd.html#sections">PECVD 장비로 돌아가기</a>
      <p class="sec-kicker"><span class="sec-kicker-no">02</span><span class="sec-kicker-of">/ 07</span><span class="sec-kicker-en">Hardware</span></p>
      <h1 class="sec-title">장비 구성</h1>
      <p class="sec-lede">챔버 안 부품과 장비 전체 모듈이 각각 하는 일을 정리할 자리입니다.</p>
    </div>
    <nav class="sec-rail-wrap" aria-label="PECVD 섹션"><ol class="sec-rail" data-sec-rail></ol></nav>
  </section>

  <main class="sec-main">
    <div class="sec-read">
      <!-- 준비 중: 2·3단계에서 채움. 아래 틀(장비 페이지 틀의 형식)은 그대로 두고 내용만 바꾼다 -->
      <div class="sec-soon">
        <p class="sec-soon-tag">준비 중</p>
        <p>이 섹션은 아직 작성 전입니다. 들어갈 내용은 다음과 같습니다.</p>
        <ul>
          <li>공정 챔버 안 부품: 샤워헤드, 히터·서셉터, 리프트 핀, 펌핑 링, 슬릿 밸브</li>
          <li>장비 전체: 진공 쪽(TM·LL·PM)과 대기 쪽(EFEM·FOUP) 나눠 보기</li>
          <li>부품 패널과 연결</li>
        </ul>
      </div>
      <h2 id="hardware">장비 구성</h2>
      <p class="todo">작성 예정</p>
    </div>
  </main>

  <!-- 이전/다음 섹션 + 장비 페이지로 (js/sections.js가 채움) -->
  <nav class="sec-pager" data-sec-pager></nav>

  <footer><a href="../../index.html">← 목차로 돌아가기</a></footer>

  <script src="../../js/pages.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/sections.js"></script>
</body>
</html>
