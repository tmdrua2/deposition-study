<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVD (물리 기상 증착) | 증착 공정 노트</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-process="pvd">
  <header id="site-header"></header>

  <!-- 첫 화면: 공정 모션. 그림은 js/sim/pvd.js가 캔버스에 그림 -->
  <section class="process-hero" data-scene="pvd">
    <canvas class="sim-canvas" role="img"
      aria-label="마그네트론 스퍼터링 챔버 단면도. 위쪽 타깃(음극) 뒤에 자석이 있고, 타깃 앞 시스에서 가속된 아르곤 이온이 타깃을 때리면 튀어나온 타깃 원자가 여러 각도로 날아가 아래쪽 웨이퍼와 실드에 쌓인다."></canvas>

    <div class="hero-copy">
      <h1>PVD (물리 기상 증착)</h1>
      <p class="subtitle">스퍼터링·증발 등 물리적 방법으로 박막을 쌓는 공정</p>
    </div>

    <!-- 아래쪽 줄: 현재 단계, 범례, 일시정지 -->
    <div class="sim-bar">
      <p class="sim-stage" data-sim-stage></p>
      <ul class="sim-legend" aria-label="그림 범례">
        <li><i class="k-ar"></i>Ar 원자</li>
        <li><i class="k-ion"></i>Ar⁺ 이온</li>
        <li><i class="k-e"></i>2차 전자</li>
        <li><i class="k-metal"></i>타깃 원자 (중성)</li>
        <li><i class="k-film"></i>쌓인 막</li>
      </ul>
      <p class="sim-caption">개념도, 실제 비율 아님</p>
      <button type="button" class="sim-pause" data-sim-pause aria-pressed="false">일시정지</button>
      <p class="sim-note" data-sim-note aria-live="polite"></p>
    </div>
  </section>

  <main>

    <!-- 아래 h2 제목들로 목차가 자동으로 만들어집니다 -->
    <nav id="page-toc"></nav>

    <!-- 1. 원리 -->
    <h2 id="principle">원리</h2>
    <p class="todo">작성 예정</p>

    <!-- 2. 장비 구성 -->
    <h2 id="hardware">장비 구성</h2>
    <p class="todo">작성 예정</p>

    <!-- 3. 공정 흐름 -->
    <h2 id="flow">공정 흐름</h2>
    <ol>
      <li class="todo">작성 예정</li>
    </ol>

    <!-- 4. 공정변수 표: 한 변수당 한 줄(<tr>) -->
    <h2 id="parameters">공정변수 표</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>변수</th>
            <th>올리면</th>
            <th>내리면</th>
            <th>트레이드오프</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="todo">작성 예정</td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 5. 문제와 점검 순서: 문제 하나당 <details> 하나 -->
    <h2 id="troubleshooting">문제와 점검 순서</h2>
    <details>
      <summary>문제 상황 (예: 두께 균일도 불량)</summary>
      <ol>
        <li class="todo">점검 1</li>
      </ol>
    </details>

    <!-- 6. 면접 질문: 질문 하나당 <details> 하나 -->
    <h2 id="interview">면접 질문</h2>
    <details>
      <summary>질문</summary>
      <p class="todo">내 답변 작성 예정</p>
    </details>

    <!-- 7. 출처 -->
    <h2 id="sources">출처</h2>
    <ul>
      <li class="todo">작성 예정</li>
    </ul>
  </main>

  <footer><a href="../index.html">← 목차로 돌아가기</a></footer>

  <script src="../js/pages.js"></script>
  <script src="../js/main.js"></script>
  <!-- 공정 모션: 공용 엔진 → PVD 장면 순서 -->
  <script src="../js/sim/sim-core.js"></script>
  <script src="../js/sim/pvd.js"></script>
</body>
</html>
