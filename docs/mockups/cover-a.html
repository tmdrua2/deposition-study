<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시안 A · 베이 진열 — 증착 공정 노트</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="lineup.css">
  <style>
    /* 시안 A: 같은 높이의 베이(칸) 5개가 한 바닥선 위에 나란히 — 조용한 진열대 */
    main.cover { max-width: none; padding: 0; margin: 0; }
    .a-hero { min-height: calc(100vh - 64px); display: grid; grid-template-rows: auto 1fr auto; gap: 28px;
      padding: 40px clamp(16px, 4vw, 56px) 28px; }
    .a-head { display: flex; align-items: end; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
    .a-name { margin: 0; }
    .a-name .ko { display: block; font-size: var(--fs-5xl); font-weight: 750; letter-spacing: -0.035em; line-height: 1.02; color: var(--ink); }
    .a-name .en { display: block; margin-top: 10px; font-family: var(--font-mono); font-size: var(--fs-sm); letter-spacing: 0.24em; color: var(--muted); }
    .a-side { width: min(420px, 100%); }
    .a-side p { margin: 0 0 14px; color: var(--muted); font-size: var(--fs-md); line-height: 1.6; }
    .a-search { width: 100%; padding: 13px 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(255,255,255,0.6); font: inherit; }
    .a-row { display: grid; grid-template-columns: 1.9fr repeat(4, 1fr); gap: 12px; min-height: 0; }
    .a-row .lineup-card { min-height: 420px; }
    .lineup-card .card-text { position: absolute; left: 20px; right: 20px; top: 18px; z-index: 2; }
    .lineup-abbr { display: block; font-size: var(--fs-2xl); }
    .lineup-card.is-main .lineup-abbr { font-size: var(--fs-4xl); }
    .card-ko { display: block; margin-top: 4px; font-size: var(--fs-sm); opacity: 0.85; }
    .lineup-status { position: absolute; left: 20px; bottom: 16px; z-index: 2; }
    .lineup-fig { left: 0; right: 0; top: 34%; bottom: 44px; }
    .lineup-card.is-main .lineup-fig { top: 22%; }
    .a-floor { display: flex; justify-content: space-between; color: var(--muted); font-size: var(--fs-xs); border-top: 1px solid var(--line-strong); padding-top: 12px; }
  </style>
</head>
<body data-root="../../">
  <header id="site-header"></header>
  <main class="cover">
    <section class="a-hero">
      <div class="a-head">
        <h1 class="a-name"><span class="ko">증착 공정 노트</span><span class="en">DEPOSITION NOTES</span></h1>
        <div class="a-side">
          <p>반도체 증착 장비를 원리, 장비 구성, 점검 순서로 정리하는 학습 노트입니다.</p>
          <input class="a-search" type="search" placeholder="검색: 예) ALD, 스퍼터, 플라즈마" aria-label="페이지 검색">
        </div>
      </div>
      <div class="a-row">
        <a class="lineup-card is-main" data-tone="pecvd" href="../../equipment/pecvd.html">
          <span class="card-text"><span class="lineup-abbr">PECVD</span><span class="card-ko">플라즈마 화학 기상 증착</span></span>
          <div class="lineup-fig" data-equip="pecvd" data-fill="0.82"></div>
          <span class="lineup-status">완성 · 7개 섹션</span>
        </a>
        <div class="lineup-card is-soon" data-tone="ald">
          <span class="card-text"><span class="lineup-abbr">ALD</span><span class="card-ko">원자층 증착</span></span>
          <div class="lineup-fig" data-equip="ald" data-fill="0.9"></div>
          <span class="lineup-status">준비 중</span>
        </div>
        <div class="lineup-card is-soon" data-tone="pvd">
          <span class="card-text"><span class="lineup-abbr">PVD</span><span class="card-ko">물리 기상 증착</span></span>
          <div class="lineup-fig" data-equip="pvd" data-fill="0.9"></div>
          <span class="lineup-status">준비 중</span>
        </div>
        <div class="lineup-card is-soon" data-tone="epi">
          <span class="card-text"><span class="lineup-abbr">Epi</span><span class="card-ko">에피택시</span></span>
          <div class="lineup-fig" data-equip="epi" data-fill="0.9"></div>
          <span class="lineup-status">준비 중</span>
        </div>
        <div class="lineup-card is-soon" data-tone="ecd">
          <span class="card-text"><span class="lineup-abbr">ECD</span><span class="card-ko">전기도금</span></span>
          <div class="lineup-fig" data-equip="ecd" data-fill="0.9"></div>
          <span class="lineup-status">준비 중</span>
        </div>
      </div>
      <div class="a-floor"><span>증착 장비 5종 · 1종 완성</span><span>아래로: 기초 → 장비사·실습 기록 → 사이트 소개</span></div>
    </section>
  </main>
  <script src="../../js/pages.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../data/platform.js"></script>
  <script src="../../data/pecvd.js"></script>
  <script src="../../data/lineup.js"></script>
  <script src="../../js/explode/render-iso.js"></script>
  <script src="../../js/home.js"></script>
</body>
</html>
