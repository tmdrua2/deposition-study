<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시안 B · 워드마크 무대 — 증착 공정 노트</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="lineup.css">
  <style>
    /* 시안 B: 화면 폭을 채우는 영문 워드마크 위로 PECVD 무대가 겹쳐 올라오고,
       준비 중 장비는 오른쪽에 차례를 기다리는 가로 띠로 쌓임 (장비 페이지의 "큰 글자 뒤 장비"와 같은 말투) */
    main.cover { max-width: none; padding: 0; margin: 0; }
    .b-hero { min-height: calc(100vh - 64px); display: flex; flex-direction: column; position: relative; padding: 28px clamp(16px, 4vw, 56px) 32px; overflow: hidden; }
    .b-top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; position: relative; z-index: 2; }
    .b-top h1 { margin: 0; font-size: var(--fs-2xl); font-weight: 750; letter-spacing: -0.02em; color: var(--ink); }
    .b-top p { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
    .b-word { margin: 4px 0 0 -0.04em; font-size: 10.4vw; font-weight: 800; letter-spacing: -0.06em; line-height: 0.82;
      color: transparent; -webkit-text-stroke: 1.5px color-mix(in srgb, var(--ink) 55%, transparent); white-space: nowrap; user-select: none; }
    .b-stage { position: relative; z-index: 2; margin-top: -3.6vw; display: grid; grid-template-columns: 1.75fr 1fr; gap: 14px; flex: 1; min-height: 400px; }
    .b-main .card-text { position: absolute; left: 26px; top: 22px; z-index: 2; }
    .b-main .lineup-abbr { display: block; font-size: var(--fs-4xl); }
    .card-ko { display: block; margin-top: 4px; font-size: var(--fs-sm); opacity: 0.85; }
    .b-main .lineup-fig { left: 30%; right: 0; top: 4%; bottom: 0; }
    .b-main .lineup-status { position: absolute; left: 26px; bottom: 22px; }
    .b-main .b-search { position: absolute; left: 26px; bottom: 60px; width: min(300px, 32%); z-index: 3; }
    .b-queue { display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; }
    .b-queue .lineup-card { border-radius: 12px; }
    .b-queue .card-text { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); z-index: 2; display: flex; align-items: baseline; gap: 12px; }
    .b-queue .lineup-abbr { font-size: var(--fs-xl); min-width: 3.2em; }
    .b-queue .lineup-status { position: absolute; right: 44%; top: 50%; transform: translateY(-50%); z-index: 2; opacity: 0.85; }
    .b-queue .lineup-fig { right: 4%; width: 40%; top: 6%; bottom: 6%; }
    .b-search input { width: 100%; padding: 11px 14px; border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; background: rgba(255,255,255,0.08); color: #fff; font: inherit; font-size: var(--fs-sm); }
    .b-search input::placeholder { color: rgba(255,255,255,0.6); }
  </style>
</head>
<body data-root="../../">
  <header id="site-header"></header>
  <main class="cover">
    <section class="b-hero">
      <div class="b-top">
        <h1>증착 공정 노트</h1>
        <p>반도체 증착 장비를 원리, 장비 구성, 점검 순서로 정리하는 학습 노트</p>
      </div>
      <p class="b-word" aria-hidden="true">DEPOSITION NOTES</p>
      <div class="b-stage">
        <a class="lineup-card b-main" data-tone="pecvd" href="../../equipment/pecvd.html">
          <span class="card-text"><span class="lineup-abbr">PECVD</span><span class="card-ko">플라즈마 화학 기상 증착</span></span>
          <div class="lineup-fig" data-equip="pecvd" data-fill="0.9"></div>
          <span class="lineup-status">완성 · 7개 섹션</span>
        </a>
        <div class="b-queue">
          <div class="lineup-card is-soon" data-tone="ald">
            <span class="card-text"><span class="lineup-abbr">ALD</span><span class="card-ko">원자층 증착</span></span>
            <span class="lineup-status">준비 중</span>
            <div class="lineup-fig" data-equip="ald" data-fill="0.95"></div>
          </div>
          <div class="lineup-card is-soon" data-tone="pvd">
            <span class="card-text"><span class="lineup-abbr">PVD</span><span class="card-ko">물리 기상 증착</span></span>
            <span class="lineup-status">준비 중</span>
            <div class="lineup-fig" data-equip="pvd" data-fill="0.95"></div>
          </div>
          <div class="lineup-card is-soon" data-tone="epi">
            <span class="card-text"><span class="lineup-abbr">Epi</span><span class="card-ko">에피택시</span></span>
            <span class="lineup-status">준비 중</span>
            <div class="lineup-fig" data-equip="epi" data-fill="0.95"></div>
          </div>
          <div class="lineup-card is-soon" data-tone="ecd">
            <span class="card-text"><span class="lineup-abbr">ECD</span><span class="card-ko">전기도금</span></span>
            <span class="lineup-status">준비 중</span>
            <div class="lineup-fig" data-equip="ecd" data-fill="0.95"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../../js/pages.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../data/platform.js"></script>
  <script src="../../data/pecvd.js"></script>
  <script src="../../data/lineup.js"></script>
  <script src="../../js/explode/render-iso.js"></script>
  <script src="../../js/home.js"></script>
</body>
</html>
