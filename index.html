<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF8">
  <title>증착 공정 노트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
  <header id="site-header"></header>

  <main class="home">
    <!-- 첫 화면: 왼쪽 제목·검색, 오른쪽 점·선 네트워크 구 (js/main.js가 그림) -->
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">Deposition Study Notes</p>
        <h1 class="dot-title">증착 공정 학습 노트</h1>
        <p class="subtitle">증착 장비사 취업 준비를 위한 개인 학습 사이트</p>

        <div class="search-box">
          <input id="search" type="search" placeholder="검색: 예) ALD, 스퍼터, 플라즈마" autocomplete="off" aria-label="페이지 검색">
          <ul id="search-results"></ul>
        </div>
      </div>

      <!-- 장식용 그림이라 화면 읽기 프로그램은 건너뜀 -->
      <div id="sphere" class="sphere" aria-hidden="true"></div>
    </section>

    <!-- 카테고리 카드: js/pages.js 목록을 바탕으로 자동 생성 -->
    <section class="home-section">
      <p class="eyebrow">Study Map</p>
      <h2 class="dot-title">학습 목차</h2>
      <div id="toc"></div>
    </section>

    <!-- 장비 목록: 공정·장비 페이지마다 그림 하나씩 자동 생성 -->
    <section class="home-section">
      <p class="eyebrow">Equipment</p>
      <h2 class="dot-title">공정·장비</h2>
      <ul id="equip-list" class="equip-list"></ul>
    </section>
  </main>

  <footer>개인 학습용 · 내용은 직접 정리한 것이며 출처를 각 페이지에 표기합니다.</footer>

  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
