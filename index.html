<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A1226">
  <title>증착 공정 노트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
  <header id="site-header"></header>

  <main class="home">
    <!-- 첫 화면: 왼쪽 제목·검색, 오른쪽 웨이퍼 그림 -->
    <section class="hero">
      <div class="hero-text">
        <h1>반도체 증착 공정 학습 노트</h1>
        <p class="subtitle">증착 장비사 취업 준비를 위한 개인 학습 사이트</p>

        <div class="search-box">
          <input id="search" type="search" placeholder="검색: 예) ALD, 스퍼터, 플라즈마" autocomplete="off" aria-label="페이지 검색">
          <ul id="search-results"></ul>
        </div>
      </div>

      <!-- 웨이퍼 그림 (장식용이라 화면 읽기 프로그램은 건너뜀)
           원 안의 작은 네모들 = 칩(다이), 아래 작은 홈 = 웨이퍼 방향 표시(노치) -->
      <div class="wafer" aria-hidden="true">
        <div class="wafer-glow"></div>
        <svg viewBox="0 0 400 400">
          <defs>
            <radialGradient id="w-body" cx="38%" cy="32%" r="75%">
              <stop offset="0" stop-color="#2C3B68"/>
              <stop offset="0.6" stop-color="#17223F"/>
              <stop offset="1" stop-color="#0E162C"/>
            </radialGradient>
            <pattern id="w-die" x="2" y="2" width="22" height="22" patternUnits="userSpaceOnUse">
              <rect x="1.5" y="1.5" width="19" height="19" rx="1" fill="#9A7CFF" fill-opacity="0.05"
                    stroke="#A9B6E8" stroke-opacity="0.2" stroke-width="0.7"/>
            </pattern>
            <linearGradient id="w-ring" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#9A7CFF"/>
              <stop offset="0.55" stop-color="#9A7CFF" stop-opacity="0.25"/>
              <stop offset="1" stop-color="#3CCFC0"/>
            </linearGradient>
            <clipPath id="w-clip"><circle cx="200" cy="200" r="158"/></clipPath>
          </defs>
          <g class="wafer-spin">
            <circle cx="200" cy="200" r="170" fill="url(#w-body)"/>
            <rect x="0" y="0" width="400" height="400" fill="url(#w-die)" clip-path="url(#w-clip)"/>
            <circle cx="200" cy="200" r="170" fill="none" stroke="url(#w-ring)" stroke-width="1.6"/>
            <circle cx="200" cy="200" r="182" fill="none" stroke="#A9B6E8" stroke-opacity="0.08" stroke-width="1"/>
            <circle cx="200" cy="370" r="5" fill="#0A1226"/>
          </g>
        </svg>
        <div class="wafer-sheen"></div>
      </div>
    </section>

    <!-- 목차는 js/pages.js 목록을 바탕으로 자동 생성됩니다 -->
    <div id="toc"></div>
  </main>

  <footer>개인 학습용 · 내용은 직접 정리한 것이며 출처를 각 페이지에 표기합니다.</footer>

  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
